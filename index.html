<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000B5E">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/composerm-logo.svg" type="image/svg+xml">
<title>ComposerM</title>
<style>
html,body{margin:0;background:#f9fafb;color:#17213b;font-family:system-ui,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
.loading{padding:24px;text-align:center}
.brand{font-weight:800;color:#000B5E;font-size:1.3rem}
</style>
</head>
<body>
<div class="loading"><div class="brand">ComposerM</div><p>Carregando aplicativo…</p></div>
<script>
(async()=>{
 const parts=['./payload/part-00.txt','./payload/part-01.txt','./payload/part-02.txt'];
 const chunks=await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok) throw new Error(p); return r.text()})));
 const bin=atob(chunks.join(''));
 const bytes=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 const html=new TextDecoder('utf-8').decode(bytes);
 document.open(); document.write(html); document.close();
})().catch(err=>{
 document.body.innerHTML='<div class="loading"><div class="brand">ComposerM</div><p>Não foi possível carregar o aplicativo.</p><button onclick="location.reload()">Tentar novamente</button></div>';
 console.error(err);
});
</script>
</body>
</html>
